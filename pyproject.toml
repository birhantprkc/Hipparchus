[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hipparchus"
version = "0.7.0"
description = "Online vector cartography desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.14.1",
  "shapely>=2.0",
  "skia-python>=87.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.1.0",
  # Used unguarded by three test files (test_status_bar.py, test_about.py,
  # test_raster_not_for_navigation.py) and by scripts/smoke_render.py and
  # scripts/make_about_art.py, but never declared anywhere -- every local
  # gated run happened to have it already, until a clean container without
  # it made the gap visible.
  "Pillow>=10.0",
]
maps = [
  "fiona>=1.9",
  "mapbox-vector-tile>=2.0",
  "osmium>=3.7",
  "pmtiles>=3.0",
  "pyarrow>=15.0",
  "rasterio>=1.3",
  "scikit-image>=0.22",
]

[project.scripts]
hipparchus = "hipparchus.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# The maker's mark is loaded at runtime, so it has to travel with the package
# rather than only existing in a checkout.
[tool.setuptools.package-data]
"hipparchus.ui" = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
