name: Tests

# The headless suite: everything that can be checked without a window.
#
# This repository had no CI at all until now, which is why two things went stale
# without anyone finding out — a fixture and a documented count, both facts about
# every commit that nothing checked. The GUI half stays out of it deliberately:
# `tests/gui_support.require_gui` skips any test that would build a real window
# unless HIPPARCHUS_GUI_TESTS is set, and a CI runner is the last place to set it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest
    # **macOS, not Linux, and that is a narrowing worth stating.**
    #
    # This is a desktop application developed and used on macOS, and its twin is
    # a macOS app. Run on ubuntu, ten tests fail for reasons that are the
    # runner's rather than the code's: the font-fallback tests ask the operating
    # system for a face covering Japanese and Korean and a bare image has none,
    # and the terrarium PNG round-trip comes back wrong in every element on that
    # graphics stack. The same tests pass here and on any developer's Mac.
    #
    # Testing the platform the software is actually run on is worth more than a
    # green tick on one it is not. Linux is a supported target in the README, so
    # the ten failures are a real gap and not a non-issue — they want a runner
    # with fonts installed and the skia behaviour understood, which is its own
    # piece of work rather than a condition of every push.
    runs-on: macos-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        # The floor stated in pyproject.toml, and the current release. A version
        # range nobody exercises is a claim rather than a fact.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Tkinter is imported at module scope in the UI package, so it has to be
      # importable even though no test here opens a window. It ships with the
      # Python that `setup-python` installs on macOS, so there is nothing to do.
      # On Debian it is a separate package, and skia-python additionally needs
      # libEGL and libGL there — see the note on the runner above.

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Run tests
        run: python -m pytest

      # The fixture is generated from the code it checks, so it can only catch a
      # change nobody meant to make — but that is precisely what it is for, and a
      # stale fixture makes the check meaningless. `--check` writes nothing.
      - name: Palette fixture is not stale
        run: python scripts/generate_palette_parity_fixture.py --check
