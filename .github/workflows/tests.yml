name: Tests

# The headless suite: everything that can be checked without a window.
#
# This repository had no CI at all until now, which is why two things went stale
# without anyone finding out — a fixture and a documented count, both facts about
# every commit that nothing checked. The GUI half stays out of it deliberately:
# `tests/gui_support.require_gui` skips any test that would build a real window
# unless HIPPARCHUS_GUI_TESTS is set, and a CI runner is the last place to set it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        # **Both platforms, on purpose.** The README says Linux is supported, and
        # a supported platform nobody runs the suite on is a hope rather than a
        # claim. Running it there is what found the colour-type bug: skia hands
        # back the image's native layout unless told otherwise, and that is BGRA
        # on Linux, so every terrain tile decoded into a plausible model of
        # nowhere. It passed on macOS for years.
        #
        # macOS is where the application is developed and where its twin is a
        # native app, so it carries the version range; Linux runs the current
        # release, which is enough to keep the platform honest without paying for
        # four jobs.
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"   # the floor pyproject.toml states
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Three things Debian needs and macOS ships.
      #
      # Tkinter is imported at module scope in the UI package, so it has to load
      # even though nothing here opens a window. skia-python links libEGL and
      # libGL, and without them the import fails as `libEGL.so.1: cannot open
      # shared object file` — which surfaces three retries later as a GIBS error
      # rather than as anything about graphics drivers. And the label
      # font-fallback tests ask the operating system for a face covering
      # Japanese and Korean: the bundled Noto Sans carries Latin, Greek and
      # Cyrillic only, and the fallback reaching the OS for everything else is
      # the behaviour under test, so the OS has to have something to find.
      - name: System libraries and fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libegl1 libgl1 fonts-noto-cjk

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Run tests
        run: python -m pytest

      # The fixture is generated from the code it checks, so it can only catch a
      # change nobody meant to make — but that is precisely what it is for, and a
      # stale fixture makes the check meaningless. `--check` writes nothing.
      - name: Palette fixture is not stale
        run: python scripts/generate_palette_parity_fixture.py --check
